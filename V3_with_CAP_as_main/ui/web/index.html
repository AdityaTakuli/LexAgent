<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LexAgent</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        // ?theme=dark or ?theme=light in the address overrides the saved choice.
        var saved = new URLSearchParams(location.search).get("theme") || localStorage.getItem("lexagent-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
